<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Conheça a Comasp Ferramentas: soluções em ferramentas, parafusos, máquinas e EPIs para profissionais e indústrias em Goiânia.">
  <title>Quem Somos | Comasp Ferramentas</title>

  <style>
    :root {
      --orange: #f15a0a;
      --orange-dark: #d94b00;
      --dark: #171717;
      --text: #292929;
      --white: #fff;
      --max: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--white);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.65;
    }

    a {
      color: inherit;
    }

    a:focus-visible {
      outline: 3px solid currentColor;
      outline-offset: 4px;
    }

    /* Título disponível para leitores de tela. */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    /* Cabeçalho e navegação */
    .topbar {
      background: var(--dark);
      color: var(--white);
      border-bottom: 4px solid var(--orange);
    }

    .nav {
      max-width: var(--max);
      margin: 0 auto;
      padding: 12px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      text-decoration: none;
    }

    .brand img {
      display: block;
      width: auto;
      height: 54px;
      max-width: min(220px, 100%);
      object-fit: contain;
    }

    .nav-links {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px 22px;
    }

    .nav-links a {
      color: var(--white);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    .nav-links a:hover {
      color: #ff8b4a;
    }

    .nav-links .nav-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 15px;
      background: var(--orange);
      border-radius: 5px;
    }

    .nav-links .nav-cta:hover {
      color: var(--white);
      background: var(--orange-dark);
    }

    /* Slides proporcionais e adaptados à largura da tela */
    .slide {
      width: 100%;
      max-width: var(--max);
      margin: 0 auto;
    }

    .slide img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Botões */
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 12px 18px;
      border: 2px solid var(--white);
      border-radius: 5px;
      color: var(--white);
      text-decoration: none;
      font-weight: 800;
      transition: background-color .2s, color .2s;
    }

    .btn:hover {
      background: var(--white);
      color: var(--orange-dark);
    }

    /* Contato */
    .contact {
      background: var(--orange);
      color: var(--white);
    }

    .contact-inner {
      max-width: var(--max);
      margin: 0 auto;
      padding: 48px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .contact-copy {
      flex: 1;
      min-width: 0;
    }

    .contact h2 {
      font-size: clamp(25px, 3vw, 36px);
      line-height: 1.2;
      margin: 0 0 12px;
    }

    .contact p {
      margin: 4px 0;
      overflow-wrap: break-word;
    }

    .contact .buttons {
      flex-shrink: 0;
    }

    /* Rodapé escuro */
    footer {
      background: #171717;
      color: #cccccc;
      padding: 24px 22px;
      font-size: 13px;
      border-top: 3px solid #f15a0a;
    }

    footer a {
      color: #ffffff;
      text-decoration: none;
    }

    footer a:hover {
      color: #f15a0a;
      text-decoration: underline;
    }

    /* Tablets e celulares */
    @media (max-width: 800px) {
      .nav {
        align-items: flex-start;
        flex-direction: column;
      }

      .nav-links {
        gap: 12px 14px;
      }

      .contact-inner {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    /* Celulares menores */
    @media (max-width: 480px) {
      .nav {
        padding: 12px 18px;
      }

      .nav-links a {
        font-size: 13px;
      }

      .contact-inner {
        padding: 36px 18px;
      }

      footer {
        padding: 24px 18px;
      }
    }

    /* Respeita a preferência por movimento reduzido */
    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .btn {
        transition: none;
      }
    }

     /* Área do catálogo: fundo branco e conteúdo centralizado */
.slide-catalogo {
  width: 100%;
  max-width: var(--max);
  min-height: 320px;
  margin: 0 auto;
  padding: 60px 22px;
  background: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.catalogo-conteudo {
  width: 100%;
  max-width: 720px;
}

.catalogo-conteudo h2 {
  margin: 0 0 18px;
  color: var(--dark);
  font-size: clamp(34px, 5vw, 54px);
  font-weight: 400;
  line-height: 1.2;
}

.catalogo-conteudo h2 span {
  color: var(--orange);
}

.catalogo-conteudo p {
  margin: 0 0 30px;
  color: var(--text);
  font-size: clamp(17px, 2.5vw, 22px);
  line-height: 1.5;
}

/* Botão de download */
.btn-catalogo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  min-height: 60px;
  padding: 16px 28px;
  background: var(--dark);
  color: #ffffff;
  border: 2px solid var(--dark);
  border-radius: 8px;
  font-size: 17px;
  font-weight: 800;
  text-decoration: none;
  transition: background-color .2s, color .2s;
}

.btn-catalogo:hover {
  background: var(--orange);
  border-color: var(--orange);
  color: #ffffff;
}

.btn-catalogo:focus-visible {
  outline: 3px solid var(--orange);
  outline-offset: 4px;
}

@media (max-width: 480px) {
  .slide-catalogo {
    min-height: 280px;
    padding: 44px 18px;
  }

  .catalogo-conteudo h2 {
    font-size: 34px;
  }

  .btn-catalogo {
    min-height: 54px;
    padding: 13px 18px;
    font-size: 15px;
  }
}
    
  /* Espaço entre o slide do catálogo e a assinatura */
.slide-catalogo {
  margin-bottom: 40px;
}
    
/* Slide de download do catálogo */
.slide-catalogo {
  width: 100%;
  max-width: var(--max);
  min-height: 340px;
  margin: 0 auto 40px;
  background: var(--orange);
  display: flex;
  align-items: center;

}

.catalogo-conteudo h2 {

.catalogo-conteudo p {
  margin: 0 0 28px;

.btn-catalogo {
  display: inline-flex;

  justify-content: center;
  min-height: 54px;
  padding: 14px 26px;
  background: var(--dark);
  color: var(--white);
  border: 2px solid var(--dark);
  border-radius: 5px;
  font-size: 16px;
  font-weight: 800;
  text-decoration: none;
  transition: background-color .2s, color .2s;
}

.btn-catalogo:hover {
  background: var(--white);
  color: var(--dark);
  border-color: var(--white);
}

@media (max-width: 480px) {
  .slide-catalogo {
    min-height: 280px;
    padding: 38px 18px;
  }

  .btn-catalogo {
    padding: 12px 18px;
    font-size: 14px;
  }
}

  /* Força o fundo branco na área do catálogo */
section.slide-catalogo,
#slide-catalogo {
  background: #ffffff !important;
  background-color: #ffffff !important;

/* Texto principal */

/* Frase em preto */

/* Botão preto */

  background: #171717 !important;

  border-color: #171717 !important;
}

/* Seta laranja */

  color: #f15a0a !important;
}

/* Efeito ao passar o mouse */
#slide-catalogo .btn-catalogo:hover {
  background: #333333 !important;
  border-color: #333333 !important;
}

  </style>
</head>
